# Orquestación de SIRA TI para DESARROLLO LOCAL: base de datos PostgreSQL,
# backend Django (con recarga automática) y frontend React (Vite).
# Para producción no uses este archivo tal cual: ver "Despliegue" en el README.
services:
  db:
    image: postgres:16-alpine
    container_name: sira_ti_db
    restart: unless-stopped
    # Lee POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD del mismo archivo que el
    # backend, para que la contraseña de la base y la que usa Django siempre coincidan.
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Solo accesible desde tu propio equipo (antes quedaba abierto a toda la red).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: sira_ti_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # Desarrollo: servidor con recarga automática (la imagen usa gunicorn por defecto).
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: sira_ti_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data:
