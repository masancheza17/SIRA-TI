    <!--
      Tipografía: Inter (Google Fonts).
      Se carga aquí (y no vía @import en index.css) para permitir
      preconnect y evitar el parpadeo de fuente sin estilo (FOUT).
      Si la identidad de marca definitiva usa otra tipografía,
      reemplazar este bloque y el token `fontFamily.sans` en
      tailwind.config.js.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>SIRA TI · Mesa de servicio</title>
  </head>

  </body>
